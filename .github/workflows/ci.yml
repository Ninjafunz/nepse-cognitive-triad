name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nepse_triad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Backend Tests
        working-directory: ./apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nepse_triad_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/nepse_triad_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests -v

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./apps/frontend/package.json

      - name: Install npm dependencies
        working-directory: ./apps/frontend
        run: npm ci || npm install

      - name: Next.js Typecheck & Build
        working-directory: ./apps/frontend
        run: npm run build
